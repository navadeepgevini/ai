<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepAI - Sign Up</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to our dedicated CSS file in static/css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, var(--bubble-bot) 0%, var(--bg-color) 100%);
        }
        
        .modal form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .modal input {
            margin-bottom: 0;
        }

        .login-logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .google-btn {
            background: #ffffff;
            color: #374151;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .google-btn:hover {
            background: #f9fafb;
            opacity: 1;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0 0.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        
        .divider::before { margin-right: .5em; }
        .divider::after { margin-left: .5em; }
        
        .footer-link {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="modal">
            <div class="login-logo">DeepAI</div>
            <h2>Create Account</h2>
            <p>Sign up to start using DeepAI</p>
            <form id="signup-form">
                <input type="email" id="email" placeholder="Email address" required>
                <input type="password" id="password" placeholder="Password (min 6 characters)" required minlength="6">
                <div id="error-msg" style="color: #ef4444; font-size: 0.85rem; display: none; text-align: left; margin-bottom: 0.5rem;"></div>
                <button type="submit" id="submit-btn">Sign Up</button>
            </form>

            <div class="divider">or</div>
            
            <button type="button" id="google-btn" class="google-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
                Sign up with Google
            </button>

            <div class="footer-link">
                Already have an account? <a href="{{ url_for('login') }}">Log in</a>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2bFN_DZPkJy4RhDeG0431pTTnRBfddPI",
            authDomain: "chatbot-dca8d.firebaseapp.com",
            projectId: "chatbot-dca8d",
            storageBucket: "chatbot-dca8d.firebasestorage.app",
            messagingSenderId: "675662802628",
            appId: "1:675662802628:web:9ee927194e1c3314662391",
            measurementId: "G-GRHYK5JKR4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const signupForm = document.getElementById('signup-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "/";
            }
        });

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            errorMsg.style.display = 'none';
            submitBtn.textContent = 'Signing up...';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    window.location.href = "/";
                })
                .catch((error) => {
                    submitBtn.textContent = 'Sign Up';
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    
                    let message = error.message;
                    if (error.code === 'auth/email-already-in-use') {
                        message = "This email is already registered.";
                    } else if (error.code === 'auth/weak-password') {
                        message = "Password should be at least 6 characters.";
                    } else if (error.code === 'auth/invalid-email') {
                        message = "Invalid email format.";
                    }
                    errorMsg.textContent = message;
                    errorMsg.style.display = 'block';
                });
        });

        const googleBtn = document.getElementById('google-btn');
        const provider = new GoogleAuthProvider();

        googleBtn.addEventListener('click', () => {
            errorMsg.style.display = 'none';
            signInWithPopup(auth, provider)
                .then((result) => {
                    // onAuthStateChanged will handle the redirect
                }).catch((error) => {
                    errorMsg.textContent = error.message;
                    errorMsg.style.display = 'block';
                });
        });
    </script>
</body>

</html>
